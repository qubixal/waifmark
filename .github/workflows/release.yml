name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.1)"
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --upgrade build pyinstaller

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build wheel
        run: python -m build --wheel .
        working-directory: benchmark

      - name: Build executable
        run: pyinstaller waifmark.spec --noconfirm
        working-directory: benchmark

      - name: Create distributable zip
        run: |
          cd benchmark/dist
          zip -r waifmark-macos-universal.zip waifmark/

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: benchmark/dist/*.whl

      - name: Upload executable zip
        uses: actions/upload-artifact@v4
        with:
          name: executable
          path: benchmark/dist/waifmark-macos-universal.zip

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "Waifmark ${{ github.event.inputs.tag || github.ref_name }}"
          body: |
            ## Install

            **pip (requires Python 3.10+)**
            ```bash
            pip install waifmark
            ```

            **Standalone executable (macOS)**
            1. Download `waifmark-macos-universal.zip`
            2. Unzip and run `./waifmark/waifmark`
          files: |
            wheel/*.whl
            executable/waifmark-macos-universal.zip
          draft: false
          prerelease: false

  publish-pypi:
    needs: build-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
