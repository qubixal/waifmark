[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waifmark"
version = "2.0.0"
description = "Benchmarking suite for evaluating agentic and roleplay capabilities of small VLLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Waifmark Contributors" }]
keywords = ["benchmark", "llm", "agentic", "roleplay", "evaluation"]

dependencies = [
    "pyyaml>=6.0.2",
    "huggingface_hub>=0.24.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "httpx>=0.27.0",
]

[project.scripts]
waifmark = "api.run:main"
waifmark-api = "api.run:main"

[tool.setuptools]
packages = ["core", "evaluation", "api", "web"]

[tool.setuptools.package-data]
api = ["*.py"]
web = ["*.html", "*.css", "*.js"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]
extend-exclude = '''
/(
  \.git
  | \.venv
  | venv
  | __pycache__
)/
'''

[tool.ruff.lint]
line-length = 120
target-version = "py310"
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
