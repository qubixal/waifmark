[theme]
# ── Waifmark dark theme (applied by the browser before first paint) ──
base = "dark"
primaryColor = "#CF8AB8"
backgroundColor = "#0F0F1A"
secondaryBackgroundColor = "#161625"
textColor = "#e0e0e0"
font = "sans serif"

[server]
# Prevent browser from caching the page
enableCORS = false
enableXsrfProtection = false

[browser]
# Don't open browser automatically on dev
gatherUsageStats = false
